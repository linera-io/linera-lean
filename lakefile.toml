name = "leanlinera"
version = "0.1.0"
keywords = ["math"]
# Plain (non-`module`) files importing Mathlib, as in lean-dag.
allowNonModules = true
defaultTargets = ["LeanLinera", "LeanLineraTest"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# No per-file copyright headers in this project.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "LeanLinera"

# Concrete models and executions, checked by `decide`, so that a definition
# change which empties the structures fails the build instead of silently
# trivialising every theorem above it.
[[lean_lib]]
name = "LeanLineraTest"
